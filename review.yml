reviews:
  - date: '2026-09-01'
    rating: 4
    summary: >-
      University pipeline re-profile with operator attribution. No vendor contract was ever
      attributed to this institution (the audit verdict counts were institution:3, no tenant,
      CNAME, hostless, shared-contract or misbased findings), so nothing had to be removed —
      the work was finding the surfaces the June 2026 pass missed. Six institution-operated
      machine-readable surfaces are live: the FreiDok plus JSON API and its OAI-PMH endpoint,
      the FreiData REST API and a second OAI-PMH endpoint, a self-hosted GitLab whose v4 API
      answers anonymously (56 public projects), and an Uptime Kuma status page with a JSON
      monitor/heartbeat feed. Newly found beyond those: the university's own Shibboleth/SAML
      Identity Provider (myLogin), published on its own host and carried in the signed DFN-AAI
      federation aggregate, plus DataCite membership (QVVC, repository QVVC.FREIDATA, DOI
      prefix 10.60493) and a ROR identifier. Only FreiDok plus is the institution's own
      engineering, so it is the only surface with a saved contract — a probed OpenAPI, JSON
      Schema, four unmodified example payloads, an error artifact and a lifecycle artifact.
      InvenioRDM, GitLab and Uptime Kuma contracts were deliberately NOT saved. Correction to
      the June profile: the FreiDok API's documented startitem/maxitems parameters do not work;
      the server honours maxRows (1-100) and start.
    endpoints:
