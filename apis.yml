apis:
  - aid: university-of-freiburg:freidok-json
    name: FreiDok plus JSON API
    description: >-
      Read-only JSON API for the FreiDok plus institutional repository and
      university bibliography, returning publication and research-data metadata
      records. Supports pagination via startitem/maxitems parameters (max 100
      items per request). Confirmed live returning ~265k publication records.
    humanURL: https://freidok.uni-freiburg.de/_/site/about
    baseURL: https://freidok.uni-freiburg.de/jsonApi/v1/
    tags: [ Research, Repository, Bibliography, Open Data, JSON ]
