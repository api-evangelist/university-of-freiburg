apis:
  - aid: university-of-freiburg:freidok-json
    name: FreiDok plus JSON API
    x-operator: institution
    description: >-
      Read-only JSON API for FreiDok plus, the institutional repository and university
      bibliography built and operated by the Universitätsbibliothek Freiburg on the
      university's own host. Four anonymous collection endpoints — publications, persons,
      institutions, projects — return a shared numFound/start/maxRows/docs envelope. Probed
      2026-09-01: 267,771 publications. Pagination is maxRows (1-100, default 20) and start;
      the startitem/maxitems parameters named in earlier descriptions of this API were probed
      and are silently ignored by the server.
    humanURL: https://freidok.uni-freiburg.de/_/site/interfaces
