---
aid: university-of-freiburg
name: University of Freiburg
description: >-
  The University of Freiburg (Albert-Ludwigs-Universität Freiburg) is a public
  research university in Freiburg im Breisgau, Germany, founded in 1457 and
  ranked #212 in the QS World University Rankings 2025. It does not operate a
  centralized public developer portal, but its university library
  (Universitätsbibliothek Freiburg) exposes several real, publicly reachable
  programmatic interfaces. The FreiDok plus institutional repository offers a
  JSON API and an OAI-PMH metadata-harvesting endpoint, and the FreiData
  research-data repository (built on InvenioRDM) provides a REST API. These are
  open, unauthenticated read endpoints intended for metadata harvesting and
  discovery rather than a formal developer program.
