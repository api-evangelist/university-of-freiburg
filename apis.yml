description: >-
  The University of Freiburg (Albert-Ludwigs-Universität Freiburg) is a public research
  university in Baden-Württemberg, Germany, founded in 1457, a member of the German U15 and
  ranked #212 in the QS World University Rankings 2025. Like most universities it operates no
  central developer portal, publishes no OpenAPI description of anything, and offers no API
  program, keys, plans or support channel for developers — but unlike most of the cohort a
  meaningful part of what it does run is genuinely its own rather than a vendor contract
  wearing its name. Its library (Universitätsbibliothek Freiburg) operates FreiDok plus, an
  institutional repository and university bibliography whose read-only JSON API and OAI-PMH 2.0
  endpoint are open, anonymous and live (267,771 publications, 238,730 persons, 1,277
  institutions and 10,612 projects as probed on 2026-09-01). The university also runs a
  FreiData research-data repository (an InvenioRDM deployment minting DataCite DOIs under its
  own prefix 10.60493), a self-hosted GitLab whose REST API answers anonymously for 56 public
  projects, a public status page with a JSON monitor feed, and its own Shibboleth/SAML Identity
  Provider published into the DFN-AAI national federation. Its library discovery catalog is
  live but IP-blocked to automated clients, and its campus-management and LMS systems (HISinOne,
  ILIAS) are human-facing only. Everything programmable here is read-only metadata infrastructure
  built for harvesting, not a product; there is nothing to sign up for and nothing to buy.
