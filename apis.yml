  detail: >-
    Probed on 2026-09-01 with a browser user-agent. Six institution-operated machine-readable
    surfaces were verified live under uni-freiburg.de, one identity-federation surface and two
    registry memberships were evidenced, and every pointer in this file was re-fetched. The
    footprint is real but narrow: it is research-metadata and infrastructure plumbing, with no
    developer program, no authentication, no published contract of the institution's own, and
    two of the live surfaces (GitLab, the Uptime Kuma status feed) are off-the-shelf products
    the university merely hosts — their contracts belong to those products, not to Freiburg, so
    only the in-house FreiDok plus API is described by an OpenAPI here. One surface is
    unreadable: katalog.ub.uni-freiburg.de returns 403 with an explicit IP-range bot block. No
    vendor contract has been attributed to the institution, and no contract is saved for any
    surface the institution did not itself build.
