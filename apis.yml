  - aid: university-of-freiburg:freidata-rest
    name: FreiData InvenioRDM REST API
    description: >-
      REST API for the FreiData research-data repository, the university's
      InvenioRDM-based platform for publishing and discovering research
      datasets. Exposes a records search and retrieval API returning JSON,
      including DOI, file, and metadata links.
    humanURL: https://freidata.uni-freiburg.de/
    baseURL: https://freidata.uni-freiburg.de/api/
    tags: [ Research Data, Repository, InvenioRDM, REST, Open Data ]
    properties:
