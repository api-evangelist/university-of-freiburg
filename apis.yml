  - aid: university-of-freiburg:freidok-oai
    name: FreiDok plus OAI-PMH
    description: >-
      OAI-PMH 2.0 metadata-harvesting endpoint for the FreiDok plus repository.
      Supports multiple metadata formats including oai_dc, marcxml,
      xMetaDissPlus, opusButton, and epicur. Used by aggregators such as BASE
      and bwScienceToShare to harvest the university's research metadata.
    humanURL: https://www.ub.uni-freiburg.de/en/open-science/open-access/freidok/
    baseURL: https://freidok.uni-freiburg.de/oai/oai2.php
    tags: [ OAI-PMH, Metadata Harvesting, Research, Repository ]
