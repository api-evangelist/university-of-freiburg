specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: University of Freiburg
providerId: university-of-freiburg
created: '2026-06-03'
modified: '2026-09-01'
reconciled: false
tags:
- Education
- Higher Education
- University
- Rate Limiting
description: >-
  University of Freiburg does not publish a unified public rate-limit table across its APIs. Open
  metadata and harvesting endpoints (OAI-PMH, IIIF, library) may throttle large-scale
  or automated harvesting; clients should harvest politely, honor Retry-After, and
  contact the relevant service for bulk access.
notes: Confirm per-service limits with each API's documentation; harvest responsibly.
sources:
- https://raw.githubusercontent.com/api-evangelist/university-of-freiburg/refs/heads/main/apis.yml
responseCodes:
  throttled: 429
limits:
- name: GitLab unauthenticated API (probed)
  scope: client
  metric: requests-per-minute
  limit: 60
  notes: >-
    Observed 2026-09-01 on https://gitlab.uni-freiburg.de/api/v4/projects — response headers
    ratelimit-limit 60, ratelimit-name throttle_unauthenticated_api, ratelimit-remaining and
    ratelimit-reset. This is the only numeric rate limit any University of Freiburg surface
    exposes, and it is GitLab's default throttle rather than a published institutional policy.
  method: probed
  source: https://gitlab.uni-freiburg.de/api/v4/projects
- name: FreiDok plus JSON API page size (probed)
  scope: request
  metric: records-per-request
  limit: 100
  notes: >-
    Observed 2026-09-01 — maxRows accepts 1-100; 101 and 200 return HTTP 400
    {"statusCode":400,"errorCode":0,"errorMsg":"invalid value for maxRows (1-100)"}. No
    per-minute or per-day quota was returned in any header, and no 429 was observed.
  method: probed
  source: https://freidok.uni-freiburg.de/jsonApi/v1/publications?maxRows=101
- name: Default
  scope: client
  metric: requests-per-minute
  limit: see service documentation
  notes: No published global limit; large harvests may be rate-limited.
policies:
- name: Backoff Strategy
  description: Exponential backoff with jitter; honor Retry-After; harvest during off-peak hours.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
